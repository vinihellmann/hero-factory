name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar contratos compartilhados
        run: npm run build -w @hero-factory/contracts

      - name: Verificar formatação
        run: npm run format:check

      - name: Executar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes com cobertura
        run: npm run coverage

      - name: Gerar builds
        run: npm run build

  integration:
    name: Integração com MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar contratos
        run: npm run build -w @hero-factory/contracts

      - name: Executar testes de integração
        run: npm run test:integration

  e2e:
    name: Fluxo E2E no Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar contratos compartilhados
        run: npm run build -w @hero-factory/contracts

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Construir e iniciar a aplicação
        run: docker compose up --build --detach --wait

      - name: Executar fluxo E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Exibir logs dos containers
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar containers
        if: always()
        run: docker compose down --volumes
